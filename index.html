<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SG試験対策">
<meta name="theme-color" content="#080c14">
<title>SG試験対策マネージャー</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23080c14'/><text y='.9em' font-size='82' x='8'>🛡️</text></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700;900&family=Space+Mono:wght@400;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:#080c14;color:#e0e0e0;font-family:'Noto Sans JP',sans-serif;min-height:100vh;overscroll-behavior:none;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:#111;}
::-webkit-scrollbar-thumb{background:#2a3a5c;border-radius:2px;}
button{font-family:'Noto Sans JP',sans-serif;-webkit-appearance:none;}
input,textarea{font-family:'Noto Sans JP',sans-serif;-webkit-appearance:none;outline:none;}
.safe-top{padding-top:env(safe-area-inset-top);}
.safe-bot{padding-bottom:env(safe-area-inset-bottom);}

/* LAYOUT */
#root{max-width:900px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
header{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.25rem;background:#0a0f1e;border-bottom:1px solid #1a2540;position:sticky;top:0;z-index:100;}
.logo{background:#00ff88;color:#000;font-weight:900;font-size:1.1rem;padding:.3rem .55rem;border-radius:4px;font-family:monospace;}
.htitle{color:#fff;font-weight:700;font-size:.95rem;}
.hsub{color:#888;font-size:.7rem;}
.hright{display:flex;align-items:center;gap:.75rem;}
.cnum{color:#ff6b35;font-size:1.6rem;font-weight:900;font-family:monospace;display:block;line-height:1;}
.clbl{color:#888;font-size:.65rem;}
.settbtn{background:transparent;border:1px solid #333;color:#888;padding:.35rem .55rem;border-radius:4px;cursor:pointer;font-size:.95rem;}
.settings-panel{background:#0d1526;border-bottom:1px solid #1a2540;padding:.85rem 1.25rem;display:flex;gap:1.5rem;flex-wrap:wrap;}
.srow{display:flex;align-items:center;gap:.6rem;}
.slbl{color:#888;font-size:.8rem;}
.sinput{background:#111827;border:1px solid #2a3a5c;color:#fff;padding:.35rem .65rem;border-radius:4px;font-size:.85rem;}
nav{display:flex;border-bottom:1px solid #1a2540;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;background:#080c14;position:sticky;top:56px;z-index:99;}
nav::-webkit-scrollbar{display:none;}
.tab{background:transparent;border:none;border-bottom:2px solid transparent;color:#666;padding:.65rem .85rem;cursor:pointer;font-size:.78rem;white-space:nowrap;}
.tab.active{color:#00ff88;border-bottom:2px solid #00ff88;}
main{padding:1.25rem;flex:1;}

/* CARDS & GRIDS */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.85rem;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.85rem;}
@media(max-width:500px){.grid2{grid-template-columns:1fr;}.grid3{grid-template-columns:1fr 1fr;}}
.card{background:#0d1526;border:1px solid #1a2540;border-radius:8px;padding:1.1rem;}
.card.fullw{grid-column:1/-1;}
.ctitle{color:#888;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:.85rem;}
.stat-card{background:#0d1526;border:1px solid #1a2540;border-radius:8px;padding:.85rem;text-align:center;}
.bar-bg{background:#1a2540;border-radius:3px;height:6px;}
.bar-fill{height:100%;border-radius:3px;transition:width .6s ease;}

/* SYLLABUS */
.cat-block{margin-bottom:.65rem;}
.cat-hdr{width:100%;background:#0d1526;border:1px solid;border-radius:8px;padding:.8rem .9rem;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
.cat-badge{padding:.15rem .45rem;border-radius:4px;font-size:.75rem;font-weight:700;font-family:monospace;}
.topic-list{background:#060a10;border:1px solid #1a2540;border-top:none;border-radius:0 0 8px 8px;}
.topic-row{display:flex;align-items:flex-start;padding:.55rem .65rem;border-bottom:1px solid #111;gap:.6rem;flex-wrap:wrap;}
.lvl-btn{border:1px solid;border-radius:4px;padding:.18rem .42rem;cursor:pointer;font-size:.65rem;transition:all .15s;}
.study-btn{background:#1a2540;border:1px solid #2a3a5c;color:#00d4ff;padding:.18rem .42rem;border-radius:4px;cursor:pointer;font-size:.75rem;}

/* TIMER */
.timer-disp{font-size:4.5rem;font-family:monospace;color:#00ff88;letter-spacing:.08em;text-shadow:0 0 30px #00ff8855;text-align:center;}
.input-field{width:100%;background:#0d1526;border:1px solid #2a3a5c;color:#fff;padding:.55rem .7rem;border-radius:6px;font-size:.9rem;}
.inp-lbl{color:#888;font-size:.78rem;display:block;margin-bottom:.35rem;}
.btn-start{background:#00ff88;color:#000;border:none;padding:.7rem 2rem;border-radius:6px;font-size:1rem;font-weight:700;cursor:pointer;}
.btn-stop{background:#ff6b35;color:#fff;border:none;padding:.7rem 2rem;border-radius:6px;font-size:1rem;font-weight:700;cursor:pointer;}
.quick-btn{background:transparent;border:1px solid;border-radius:4px;padding:.18rem .42rem;cursor:pointer;font-size:.65rem;}

/* FLASHCARD */
.fc-card{width:100%;min-height:240px;background:#0d1526;border:2px solid #1a2540;border-radius:16px;padding:2.5rem 1.5rem 1.75rem;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;transition:border-color .3s,background .3s;box-shadow:0 8px 32px #00000055;}
.btn-ok{background:#00ff88;color:#000;border:none;padding:.75rem 2rem;border-radius:8px;font-size:.95rem;font-weight:700;cursor:pointer;}
.btn-ng{background:#1a2540;border:2px solid #ff6b35;color:#ff6b35;padding:.75rem 1.75rem;border-radius:8px;font-size:.95rem;font-weight:700;cursor:pointer;}
.back-btn{background:transparent;border:1px solid #2a3a5c;color:#888;padding:.32rem .65rem;border-radius:4px;cursor:pointer;font-size:.75rem;white-space:nowrap;}
.card-list-row{background:#0d1526;border:1px solid #1a2540;border-radius:6px;padding:.75rem .9rem;display:flex;align-items:flex-start;gap:.65rem;}
.icon-btn{background:transparent;border:1px solid #2a3a5c;color:#888;width:26px;height:26px;border-radius:4px;cursor:pointer;font-size:.78rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.filter-btn{background:transparent;border:1px solid;border-radius:4px;padding:.28rem .65rem;cursor:pointer;font-size:.72rem;}

/* TEXTAREA */
.textarea-field{width:100%;min-height:350px;background:#0d1526;border:1px solid #2a3a5c;color:#ccc;padding:.9rem;border-radius:6px;font-size:.88rem;resize:vertical;line-height:1.7;}

/* LOG ROW */
.log-row{display:flex;gap:.85rem;padding:.55rem .7rem;border-bottom:1px solid #111;align-items:center;}
</style>
</head>
<body>
<div id="root"></div>

<script>
// ===================== DATA =====================
const SYLLABUS=[
  {id:"A",name:"情報セキュリティ全般",color:"#00ff88",topics:[
    {id:"A1",name:"情報セキュリティの概念",w:3},{id:"A2",name:"情報セキュリティの脅威",w:4},
    {id:"A3",name:"情報セキュリティ対策",w:4},{id:"A4",name:"暗号技術",w:3},{id:"A5",name:"認証技術",w:3}]},
  {id:"B",name:"情報セキュリティ管理",color:"#00d4ff",topics:[
    {id:"B1",name:"情報資産管理",w:3},{id:"B2",name:"リスクマネジメント",w:4},
    {id:"B3",name:"セキュリティポリシー",w:3},{id:"B4",name:"情報セキュリティ組織・機関",w:2},
    {id:"B5",name:"情報セキュリティインシデント管理",w:4},{id:"B6",name:"情報セキュリティ継続",w:2}]},
  {id:"C",name:"情報セキュリティ対策",color:"#ff6b35",topics:[
    {id:"C1",name:"人的セキュリティ対策",w:3},{id:"C2",name:"物理的セキュリティ対策",w:2},
    {id:"C3",name:"技術的セキュリティ対策",w:4},{id:"C4",name:"システム開発のセキュリティ",w:3},{id:"C5",name:"ネットワークセキュリティ",w:4}]},
  {id:"D",name:"情報セキュリティ関連法規",color:"#c084fc",topics:[
    {id:"D1",name:"セキュリティ関連法規",w:3},{id:"D2",name:"個人情報保護関連法規",w:3},
    {id:"D3",name:"知的財産権",w:2},{id:"D4",name:"労働関連・取引関連法規",w:2}]}
];
const ALL_TOPICS=SYLLABUS.flatMap(s=>s.topics.map(t=>({...t,cat:s.id,catName:s.name,color:s.color})));
const LEVEL_LABELS=["未着手","学習中","理解済","完了"];
const LEVEL_COLORS=["#333","#ff6b35","#00d4ff","#00ff88"];
// カテゴリの色を取得（トピックIDにも対応）
function tagColor(tag){
  if(!tag) return "#888";
  const c=tag[0];
  return {A:"#00ff88",B:"#00d4ff",C:"#ff6b35",D:"#c084fc",U:"#ffd700"}[c]||"#888";
}
const TAG_COLORS={A:"#00ff88",B:"#00d4ff",C:"#ff6b35",D:"#c084fc",USER:"#ffd700",ALL:"#888"};
const TAG_NAMES={
  A:"セキュリティ全般",B:"セキュリティ管理",C:"セキュリティ対策",D:"関連法規",USER:"マイカード",
  A1:"情報セキュリティの概念",A2:"情報セキュリティの脅威",A3:"情報セキュリティ対策",A4:"暗号技術",A5:"認証技術",
  B1:"情報資産管理",B2:"リスクマネジメント",B3:"セキュリティポリシー",B4:"情報セキュリティ組織・機関",B5:"インシデント管理",B6:"情報セキュリティ継続",
  C1:"人的セキュリティ対策",C2:"物理的セキュリティ対策",C3:"技術的セキュリティ対策",C4:"システム開発のセキュリティ",C5:"ネットワークセキュリティ",
  D1:"セキュリティ関連法規",D2:"個人情報保護関連法規",D3:"知的財産権",D4:"労働関連・取引関連法規"
};

const PRESET_CARDS=[
  // ===== A1 情報セキュリティの概念 =====
  {id:"p1",tag:"A1",term:"機密性（Confidentiality）",def:"許可された者だけが情報にアクセスできること。CIAの一つ。アクセス制御・暗号化などで実現する。"},
  {id:"p2",tag:"A1",term:"完全性（Integrity）",def:"情報が正確かつ完全な状態に保たれること。ハッシュ関数・デジタル署名などで改ざんを検知する。"},
  {id:"p3",tag:"A1",term:"可用性（Availability）",def:"許可された利用者が必要なときに情報を利用できること。冗長化・バックアップで障害に備える。"},
  {id:"p4",tag:"A1",term:"真正性（Authenticity）",def:"情報の発信者が主張どおりの本人であると確認できること。デジタル署名や認証で確保する。"},
  {id:"p5",tag:"A1",term:"否認防止（Non-repudiation）",def:"送受信した事実を後から否定できないようにすること。デジタル署名・ログ保全が手段となる。"},
  {id:"p6",tag:"A1",term:"責任追跡性（Accountability）",def:"誰がいつ何をしたかを追跡できること。ログ管理・監査証跡の保全が重要。"},
  // ===== A2 情報セキュリティの脅威 =====
  {id:"p7",tag:"A2",term:"マルウェア",def:"悪意のあるソフトウェアの総称。ウイルス・ワーム・トロイの木馬・スパイウェア・ランサムウェアなどを含む。"},
  {id:"p8",tag:"A2",term:"ランサムウェア",def:"端末のファイルを暗号化し、復号と引き換えに身代金を要求するマルウェア。バックアップが最大の対策。"},
  {id:"p9",tag:"A2",term:"フィッシング（Phishing）",def:"実在する機関を装った偽サイト・偽メールで、パスワードやクレジット情報を騙し取る攻撃。"},
  {id:"p10",tag:"A2",term:"ゼロデイ攻撃",def:"脆弱性が公表・修正される前に悪用される攻撃。パッチが存在しないため防御が難しい。"},
  {id:"p11",tag:"A2",term:"標的型攻撃（APT）",def:"特定組織を長期間・多段階で狙う攻撃。巧妙なメールで初期侵入し、内部で横展開（ラテラルムーブメント）する。"},
  {id:"p12",tag:"A2",term:"ソーシャルエンジニアリング",def:"技術的手段を使わず人間の心理・行動を利用して情報を盗む手法。なりすまし・のぞき見・廃棄物漁りなど。"},
  {id:"p13",tag:"A2",term:"内部不正",def:"組織内部の関係者が権限を悪用して行う不正行為。特権ID管理・職務分離・操作ログ監視が対策。"},
  // ===== A3 情報セキュリティ対策 =====
  {id:"p14",tag:"A3",term:"多層防御（Defense in Depth）",def:"複数の異なる対策を重ね、一つが破られても被害を最小化する考え方。"},
  {id:"p15",tag:"A3",term:"パッチマネジメント",def:"OSやソフトウェアの脆弱性を修正するパッチを適時に適用する管理活動。"},
  {id:"p16",tag:"A3",term:"バックアップ",def:"データを別媒体・別拠点にコピーして保全する対策。3-2-1ルール（3コピー・2種類媒体・1拠点外）が推奨される。"},
  {id:"p17",tag:"A3",term:"ログ管理",def:"システムの操作・通信・エラーを記録し、インシデント発生時の追跡・証拠保全に活用する対策。"},
  // ===== A4 暗号技術 =====
  {id:"p18",tag:"A4",term:"共通鍵暗号方式",def:"暗号化と復号に同じ鍵を使う方式。AESが代表例。高速だが鍵配送問題がある。"},
  {id:"p19",tag:"A4",term:"公開鍵暗号方式",def:"公開鍵で暗号化・秘密鍵で復号する方式。RSA・楕円曲線が代表例。鍵配送問題を解決するが処理が遅い。"},
  {id:"p20",tag:"A4",term:"ハッシュ関数",def:"任意長データから固定長のハッシュ値を生成する関数。SHA-256が代表。一方向性・衝突耐性が特性。"},
  {id:"p21",tag:"A4",term:"デジタル署名",def:"送信者が秘密鍵でハッシュを署名し、受信者が公開鍵で検証する仕組み。なりすまし防止・改ざん検知・否認防止に効果的。"},
  {id:"p22",tag:"A4",term:"PKI（公開鍵基盤）",def:"認証局（CA）がデジタル証明書を発行・管理し、公開鍵の正当性を保証する仕組み。"},
  {id:"p23",tag:"A4",term:"SSL/TLS",def:"Webなどの通信を暗号化するプロトコル。サーバ証明書による認証と共通鍵による暗号化を組み合わせる。"},
  // ===== A5 認証技術 =====
  {id:"p24",tag:"A5",term:"多要素認証（MFA）",def:"知識・所持・生体の3要素のうち2つ以上を組み合わせた認証。パスワード単体より大幅に安全。"},
  {id:"p25",tag:"A5",term:"シングルサインオン（SSO）",def:"一度の認証で複数のシステムにアクセスできる仕組み。利便性向上とパスワード管理の一元化が利点。"},
  {id:"p26",tag:"A5",term:"生体認証（バイオメトリクス）",def:"指紋・顔・虹彩・静脈など身体的特徴を使った認証。なりすましが困難だが、漏洩時に変更できない欠点がある。"},
  {id:"p27",tag:"A5",term:"FIDO認証",def:"パスワードレス認証の国際標準。公開鍵暗号を用い、フィッシングや盗聴に強い認証を実現する。"},
  {id:"p28",tag:"A5",term:"ワンタイムパスワード（OTP）",def:"一度しか使えないパスワード。TOTP（時間ベース）とHOTP（カウンタベース）がある。"},
  // ===== B1 情報資産管理 =====
  {id:"p29",tag:"B1",term:"情報資産台帳",def:"組織が保有する情報資産を一覧管理する台帳。資産の種別・所有者・重要度・保管場所などを記載する。"},
  {id:"p30",tag:"B1",term:"情報の分類とラベリング",def:"情報を機密性レベル（極秘・秘・社外秘・公開など）で分類し、適切な取り扱い方法を定める活動。"},
  {id:"p31",tag:"B1",term:"情報オーナー",def:"情報資産に対して最終的な責任を持つ人物。通常は業務部門の管理職が担当する。"},
  {id:"p32",tag:"B1",term:"メディアの廃棄管理",def:"USBや紙媒体を廃棄する際に情報が漏洩しないよう、データ消去・物理破壊・専門業者委託などを行うこと。"},
  // ===== B2 リスクマネジメント =====
  {id:"p33",tag:"B2",term:"リスクアセスメント",def:"リスクを特定・分析・評価するプロセス全体。どのリスクにどう対応するかの優先順位を決める。"},
  {id:"p34",tag:"B2",term:"リスク対応の4種類",def:"①回避（活動を中止）②低減（対策を実施）③移転（保険・外部委託）④受容（コスト対比でそのまま受け入れる）"},
  {id:"p35",tag:"B2",term:"残留リスク",def:"対策を実施した後も残るリスク。経営層が受容するかどうかを判断する。完全なリスクゼロは不可能。"},
  {id:"p36",tag:"B2",term:"リスク値の算出",def:"リスク値＝脅威×脆弱性×資産価値 で表すことが多い。数値化することで対策の優先順位付けができる。"},
  {id:"p37",tag:"B2",term:"脆弱性と脅威の違い",def:"脆弱性：攻撃される可能性のある弱点（例：パッチ未適用）。脅威：その弱点を突く要因（例：マルウェア）。"},
  // ===== B3 セキュリティポリシー =====
  {id:"p38",tag:"B3",term:"情報セキュリティポリシー",def:"組織の情報セキュリティに関する基本方針・規則・手順を定めた文書体系。方針・対策基準・実施手順の3層構造が一般的。"},
  {id:"p39",tag:"B3",term:"情報セキュリティ基本方針",def:"経営層が宣言する最上位の文書。セキュリティへの取り組み姿勢・目標・責任を示す。"},
  {id:"p40",tag:"B3",term:"対策基準（セキュリティ基準）",def:"基本方針を実現するための具体的なルールを定めた文書。部門・システム別に作成することもある。"},
  {id:"p41",tag:"B3",term:"実施手順（セキュリティ手順書）",def:"対策基準を実行するための具体的な操作手順。担当者が実務で参照する最下層の文書。"},
  // ===== B4 情報セキュリティ組織・機関 =====
  {id:"p42",tag:"B4",term:"CSIRT",def:"Computer Security Incident Response Team。インシデント発生時に対応する専門チーム。平時は情報収集・訓練も担う。"},
  {id:"p43",tag:"B4",term:"SOC（セキュリティオペレーションセンター）",def:"24時間365日ネットワークやシステムを監視し、脅威を検知・分析・報告する専門組織。"},
  {id:"p44",tag:"B4",term:"CISO（最高情報セキュリティ責任者）",def:"組織のセキュリティ戦略を統括する経営幹部。CIOとは異なりセキュリティに特化した役職。"},
  {id:"p45",tag:"B4",term:"IPA（情報処理推進機構）",def:"日本のIT施策を担う独立行政法人。脆弱性情報の収集・公開、セキュリティ啓発活動、IPAセキュリティセンターを運営。"},
  {id:"p46",tag:"B4",term:"JPCERT/CC",def:"日本のサイバーセキュリティインシデントを調整・対応する非営利組織。脆弱性情報の受付・調整も行う。"},
  // ===== B5 情報セキュリティインシデント管理 =====

// ===================== UTILS =====================
function fmtTime(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}
function daysUntil(d){if(!d)return null;return Math.ceil((new Date(d)-new Date())/86400000);}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function todayStr(){return new Date().toLocaleDateString("ja-JP");}
function todayMinutes(){return Math.round(state.logs.filter(l=>l.date===todayStr()).reduce((a,b)=>a+b.sec,0)/60);}
function goalPct(){return Math.min(100,Math.round(todayMinutes()/state.dailyGoal*100));}
function overallPct(){
  const total=ALL_TOPICS.length;
  const done=ALL_TOPICS.filter(t=>(state.progress[t.id]||0)>=3).length;
  return Math.round(done/total*100);
}
function filteredCards(){
  return state.cards.filter(c=>{
    const ft=state.fcFilterTag;
    // ALL: 全件 / A〜D: カテゴリ前方一致 / USER: 完全一致 / A1〜D4: 完全一致
    const tagOk=ft==="ALL"||(ft.length===1?c.tag.startsWith(ft):c.tag===ft);
    const st=state.fcFilterStatus;
    const statusOk=st==="ALL"||(st==="none"?!state.cardResults[c.id]:state.cardResults[c.id]===st);
    return tagOk&&statusOk;
  });
}

  </div>`;

function donut(pct,color,size){
  const r=size/2-8;const circ=2*Math.PI*r;const dash=(pct/100)*circ;
  return `<svg width="${size}" height="${size}" style="transform:rotate(-90deg);flex-shrink:0">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#1a1a2e" stroke-width="9"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="9" stroke-dasharray="${dash} ${circ}" stroke-linecap="round"/>
  </svg>`;
}

      if(recent.length===0) return '<div style="color:#555;font-size:.82rem;padding:.25rem 0">まだクイズを解いていません</div>';
      const best=Math.max(...state.qzHistory.map(h=>Math.round(h.score/h.total*100)));
      const last=recent[0];const lastPct=Math.round(last.score/last.total*100);
      const col=lastPct>=80?"#00ff88":lastPct>=60?"#00d4ff":"#ff6b35";
      return `<div style="display:flex;gap:1rem;margin-bottom:.7rem;text-align:center">
        <div style="flex:1"><div style="color:${col};font-size:1.75rem;font-weight:900;font-family:monospace">${lastPct}%</div><div style="color:#888;font-size:.65rem">直近</div></div>
        <div style="flex:1"><div style="color:#00ff88;font-size:1.75rem;font-weight:900;font-family:monospace">${best}%</div><div style="color:#888;font-size:.65rem">最高</div></div>
        <div style="flex:1"><div style="color:#888;font-size:1.75rem;font-weight:900;font-family:monospace">${state.qzHistory.length}</div><div style="color:#888;font-size:.65rem">回</div></div>
      </div>
      <div class="bar-bg"><div class="bar-fill" style="width:${lastPct}%;background:${col}"></div></div>`;
    })()}
  </div>

  <div class="card fullw">
    <div class="ctitle">カテゴリ別進捗</div>
    ${catStats.map(cat=>`
    <div style="margin-bottom:.65rem">
      <div style="display:flex;justify-content:space-between;margin-bottom:.28rem">
        <span style="color:${cat.color};font-size:.8rem">${cat.name}</span>
        <span style="color:#888;font-size:.75rem">${cat.done}/${cat.total}</span>
      </div>
      <div class="bar-bg"><div class="bar-fill" style="width:${cat.pct}%;background:${cat.color}"></div></div>
    </div>`).join("")}
  </div>

  <div class="card fullw">
    <div class="ctitle">週間学習グラフ</div>
    <div style="display:flex;align-items:flex-end;gap:.4rem;height:90px">
      ${weekData.map((d,i)=>`
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px">
        <div style="font-size:.6rem;color:#888">${d.mins>0?d.mins+"m":""}</div>
        <div style="width:100%;height:${Math.max(4,d.mins/maxMins*72)}px;background:${i===6?"#00ff88":"#00d4ff44"};border-radius:3px 3px 0 0;border:1px solid ${i===6?"#00ff88":"#00d4ff33"}"></div>
        <div style="font-size:.72rem;color:${i===6?"#fff":"#666"}">${d.label}</div>
      </div>`).join("")}
    </div>
  </div>
</div>`;
}

function buildFlashcard(){
  if(state.fcMode==="done") return buildFcDone();
  if(state.fcMode==="study") return buildFcStudy();
  if(state.fcMode==="add"||state.fcMode==="edit") return buildFcForm();
  return buildFcList();
}

function buildFcList(){
  const fc=filteredCards();
  const ft=state.fcFilterTag;
  // 選択中カテゴリのトピック一覧（A〜D選択時のみ）
  const activeCat=SYLLABUS.find(s=>s.id===ft);
  // ステータス別カウント（現在のタグフィルター適用後）
  function statusCount(v){
    const base=state.cards.filter(c=>{
      const tagOk=ft==="ALL"||(ft.length===1?c.tag.startsWith(ft):c.tag===ft);
      return tagOk;
    });
    if(v==="ALL") return base.length;
    if(v==="none") return base.filter(c=>!state.cardResults[c.id]).length;
    return base.filter(c=>state.cardResults[c.id]===v).length;
  }
  return `
  <!-- カテゴリフィルター -->
  <div style="display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.5rem">
    ${["ALL","A","B","C","D","USER"].map(t=>{
      const col=TAG_COLORS[t]||"#888";
      const cnt=t==="ALL"?state.cards.length:t==="USER"?state.cards.filter(c=>c.tag==="USER").length:state.cards.filter(c=>c.tag.startsWith(t)&&c.tag!=="USER").length;
      const isActive=ft===t||(ft.length===2&&ft[0]===t);
      return `<button class="filter-btn" style="border-color:${col}99;color:${isActive?"#000":col};background:${isActive?col:"transparent"};font-size:.72rem;padding:.28rem .65rem" onclick="setFcTag('${t}')">
        ${t==="ALL"?"すべて":t==="USER"?"🔖 マイカード":t+": "+(TAG_NAMES[t]||t)}（${cnt}）
      </button>`;
    }).join("")}
  </div>
  <!-- トピックサブフィルター（A〜D選択時のみ表示） -->
  ${activeCat?`<div style="display:flex;flex-wrap:wrap;gap:.3rem;margin-bottom:.5rem;padding:.5rem .6rem;background:#060a10;border-radius:6px;border:1px solid #1a2540">
    <button class="filter-btn" style="border-color:${activeCat.color}88;color:${ft===activeCat.id?"#000":activeCat.color};background:${ft===activeCat.id?activeCat.color:"transparent"};font-size:.68rem;padding:.22rem .55rem" onclick="setFcTag('${activeCat.id}')">
      ${activeCat.id}（全${state.cards.filter(c=>c.tag.startsWith(activeCat.id)&&c.tag!=="USER").length}枚）
    </button>
    ${activeCat.topics.map(topic=>{
      const cnt=state.cards.filter(c=>c.tag===topic.id).length;
      const isActive=ft===topic.id;
      return `<button class="filter-btn" style="border-color:${activeCat.color}66;color:${isActive?"#000":activeCat.color};background:${isActive?activeCat.color:"transparent"};font-size:.68rem;padding:.22rem .55rem" onclick="setFcTag('${topic.id}')">
        ${topic.id}: ${topic.name}（${cnt}）
      </button>`;
    }).join("")}
  </div>`:""}
  <!-- ステータスフィルター -->
  <div style="display:flex;flex-wrap:wrap;gap:.3rem;margin-bottom:1rem">
    ${[["ALL","すべて","#888"],["none","未回答","#888"],["ok","✓ 覚えた","#00ff88"],["ng","✗ 要復習","#ff6b35"]].map(([v,lbl,col])=>`
    <button class="filter-btn" style="border-color:${col}88;color:${state.fcFilterStatus===v?"#000":col};background:${state.fcFilterStatus===v?col:"transparent"};font-size:.72rem;padding:.28rem .65rem" onclick="setFcStatus('${v}')">
      ${lbl}（${statusCount(v)}）
    </button>`).join("")}
  </div>
  <!-- アクション -->
  <div style="display:flex;gap:.6rem;margin-bottom:1.1rem;flex-wrap:wrap;align-items:center">
    <button class="btn-start" style="padding:.6rem 1.4rem;font-size:.88rem;${fc.length===0?"opacity:.4;pointer-events:none":""}" onclick="startStudy()">▶ ${fc.length}枚で学習開始</button>
    <button onclick="fcAddMode()" style="background:transparent;border:1px solid #2a3a5c;color:#ccc;padding:.55rem .9rem;border-radius:6px;cursor:pointer;font-size:.82rem">＋ カードを追加</button>
    <button onclick="resetResults()" style="background:transparent;border:1px solid #ff6b3533;color:#ff6b3599;padding:.45rem .75rem;border-radius:6px;cursor:pointer;font-size:.72rem">リセット</button>
  </div>
  <!-- カード一覧 -->
  ${fc.length===0?`<div style="color:#555;text-align:center;padding:2.5rem">該当するカードがありません</div>`:""}
  <div style="display:flex;flex-direction:column;gap:.45rem">
    ${fc.map(card=>{
      const res=state.cardResults[card.id];
      const tc=tagColor(card.tag);
      const topicName=TAG_NAMES[card.tag]||"";
      return `<div class="card-list-row" style="border-left:3px solid ${tc}">
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:.4rem;margin-bottom:.3rem;flex-wrap:wrap">
            <span style="background:${tc}22;color:${tc};padding:.1rem .38rem;border-radius:3px;font-size:.65rem;font-family:monospace;font-weight:700">${card.tag}</span>
            ${topicName&&card.tag.length===2?`<span style="color:#555;font-size:.65rem">${topicName}</span>`:""}
            ${res==="ok"?`<span style="color:#00ff88;font-size:.68rem">✓ 覚えた</span>`:res==="ng"?`<span style="color:#ff6b35;font-size:.68rem">✗ 要復習</span>`:`<span style="color:#555;font-size:.68rem">未回答</span>`}
          </div>
          <div style="color:#fff;font-weight:600;font-size:.88rem;margin-bottom:.28rem">${card.term}</div>
          <div style="color:#666;font-size:.78rem;line-height:1.5">${card.def}</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:.35rem;flex-shrink:0">
          <button class="icon-btn" title="編集" onclick='fcEdit(${JSON.stringify(card.id)})'>✎</button>
          ${card.tag==="USER"?`<button class="icon-btn" title="削除" style="color:#ff6b35;border-color:#ff6b3533" onclick="fcDelete('${card.id}')">✕</button>`:""}
        </div>
      </div>`;
    }).join("")}
  </div>
  <div style="color:#444;font-size:.68rem;text-align:center;margin-top:1.25rem">プリセット94枚（18トピック別）＋マイカード</div>`;
}

function buildFcStudy(){
  const card=state.studyCards[state.studyIndex];
  if(!card) return "";
  const tc=tagColor(card.tag);
  const topicName=TAG_NAMES[card.tag]||"";
  const res=state.cardResults[card.id];
  const total=state.studyCards.length;
  const pct=Math.round(state.studyIndex/total*100);
  const soFar=state.studyCards.slice(0,state.studyIndex);
  const okSoFar=soFar.filter(c=>state.cardResults[c.id]==="ok").length;
  const ngSoFar=soFar.filter(c=>state.cardResults[c.id]==="ng").length;
  return `
  <div style="display:flex;flex-direction:column;align-items:center;gap:1.1rem">
    <div style="width:100%;display:flex;align-items:center;gap:.65rem">
      <button class="back-btn" onclick="setFcMode('list')">← 一覧</button>
      <div style="flex:1;background:#1a2540;border-radius:3px;height:6px"><div style="height:100%;border-radius:3px;background:#00d4ff;width:${pct}%;transition:width .4s ease"></div></div>
      <span style="color:#888;font-size:.78rem;white-space:nowrap">${state.studyIndex+1} / ${total}</span>
    </div>
    <div style="display:flex;gap:1.25rem">
      <span style="color:#00ff88;font-size:.82rem">✓ ${okSoFar}</span>
      <span style="color:#ff6b35;font-size:.82rem">✗ ${ngSoFar}</span>
    </div>
    <div class="fc-card" style="border-color:${state.fcJudged?(res==="ok"?"#00ff88":"#ff6b35"):(state.fcFlipped?"#2a3a5c":"#1a2540")};background:${state.fcJudged?(res==="ok"?"#00ff8808":"#ff6b3508"):"#0d1526"};cursor:${state.fcJudged?"default":"pointer"}" onclick="fcFlip()">
      <div style="position:absolute;top:.85rem;left:.85rem;display:flex;gap:.35rem;align-items:center">
        <span style="background:${tc}22;color:${tc};padding:.12rem .4rem;border-radius:3px;font-size:.65rem;font-family:monospace;font-weight:700">${card.tag}</span>
        <span style="color:#555;font-size:.65rem">${topicName}</span>
      </div>
      ${state.fcJudged?`<div style="position:absolute;top:.85rem;right:.85rem;font-size:1.35rem">${res==="ok"?"✓":"✗"}</div>`:""}
      ${!state.fcFlipped?`
        <div style="text-align:center;padding-top:.75rem">
          <div style="color:#555;font-size:.65rem;margin-bottom:.85rem;letter-spacing:.1em;text-transform:uppercase">用語</div>
          <div style="color:#fff;font-size:1.2rem;font-weight:700;line-height:1.6">${card.term}</div>
          ${!state.fcJudged?`<div style="color:#444;font-size:.72rem;margin-top:1.25rem">タップして答えを見る ▼</div>`:""}
        </div>`:
        `<div style="text-align:center;padding-top:.75rem">
          <div style="color:#00d4ff;font-size:.95rem;font-weight:700;margin-bottom:.85rem;padding-bottom:.75rem;border-bottom:1px solid #1a2540">${card.term}</div>
          <div style="color:#555;font-size:.65rem;margin-bottom:.4rem;letter-spacing:.1em;text-transform:uppercase">意味・解説</div>
          <div style="color:#e0e0e0;font-size:.9rem;line-height:1.72">${card.def}</div>
        </div>`}
    </div>
    ${state.fcFlipped&&!state.fcJudged?`
    <div style="display:flex;gap:.85rem">
      <button class="btn-ng" onclick="judgeCard('ng')">✗ もう一度</button>
      <button class="btn-ok" onclick="judgeCard('ok')">✓ 覚えた！</button>
    </div>`:""}
    ${state.fcJudged?`<div style="color:${res==="ok"?"#00ff88":"#ff6b35"};font-size:.85rem">${res==="ok"?"✓ 次のカードへ...":"✗ 次のカードへ..."}</div>`:""}
  </div>`;
}

      <div class="stat-card"><div style="color:#888;font-size:.75rem;margin-bottom:.25rem">✗ 要復習</div><div style="color:#ff6b35;font-size:2.2rem;font-weight:900;font-family:monospace">${ng}</div></div>

      <div class="bar-bg" style="margin-top:.65rem"><div class="bar-fill" style="width:${gp}%;background:${gp>=100?"#00ff88":"#00d4ff"}"></div></div>

// ===================== QUIZ =====================
function makeQuizQuestions(cards, qType, count){
  const pool=shuffle([...cards]).slice(0,Math.min(count,cards.length));
  return pool.map(card=>{
    const qt=(qType==="both")?(Math.random()<.5?"term2def":"def2term"):qType;
    // 正解以外から3枚ランダム選択（同じカードは除く）
    const others=shuffle(cards.filter(c=>c.id!==card.id)).slice(0,3);
    const allChoices=shuffle([card,...others]);
    const answerIdx=allChoices.findIndex(c=>c.id===card.id);
    return {card,qType:qt,choices:allChoices,answerIdx,chosen:null};
  });
}

function buildQuiz(){
  if(state.qzMode==="playing") return buildQzPlaying();
  if(state.qzMode==="done")    return buildQzDone();
  return buildQzSetup();
}

// Quiz events
function setQzTag(t){state.qzFilterTag=t;render();}
function setQzQType(v){state.qzQType=v;render();}
function setQzCount(n){state.qzCount=n;render();}
function qzBackToSetup(){state.qzMode="setup";render();}

function startQuiz(){
  const ft=state.qzFilterTag;
  const pool=state.cards.filter(c=>{
    const tagOk=ft==="ALL"||(ft.length===1?c.tag.startsWith(ft):c.tag===ft);
    return tagOk&&c.tag!=="USER"||c.tag==="USER";
  });
  const cnt=Math.min(state.qzCount,pool.length);
  state.qzQuestions=makeQuizQuestions(pool,state.qzQType,cnt);
  state.qzIndex=0;state.qzChosen=null;state.qzMode="playing";render();
}

function qzChoose(idx){
  if(state.qzChosen!==null) return;
  state.qzQuestions[state.qzIndex].chosen=idx;
  state.qzChosen=idx;
  render();
}

function qzNext(){
  if(state.qzIndex<state.qzQuestions.length-1){
    state.qzIndex++;state.qzChosen=state.qzQuestions[state.qzIndex].chosen;render();
  }else{
    // 結果保存
    const score=state.qzQuestions.filter(q=>q.chosen===q.answerIdx).length;
    state.qzHistory=[...state.qzHistory,{date:todayStr(),score,total:state.qzQuestions.length}].slice(-20);
    DB.set("sg_qzhistory",state.qzHistory);
    state.qzMode="done";render();
  }
}

function qzRetryWrong(){
  const wrongCards=state.qzQuestions.filter(q=>q.chosen!==q.answerIdx).map(q=>q.card);
  if(wrongCards.length<1) return;
  // 間違えたカードで再クイズ（4択には最低4枚必要なので全プールから差し込む）
  const ft=state.qzFilterTag;
  const fullPool=state.cards.filter(c=>{
    const tagOk=ft==="ALL"||(ft.length===1?c.tag.startsWith(ft):c.tag===ft);
    return tagOk;
  });
  state.qzQuestions=makeQuizQuestions(fullPool.length>=4?fullPool:state.cards,state.qzQType,wrongCards.length*2);
  // 先頭をwrongCardsで固定
  const extraPool=state.cards.filter(c=>!wrongCards.find(w=>w.id===c.id));
  state.qzQuestions=makeQuizQuestions([...wrongCards,...shuffle(extraPool)],state.qzQType,wrongCards.length);
  state.qzIndex=0;state.qzChosen=null;state.qzMode="playing";render();
}


// ===================== INIT =====================
render();
</script>
